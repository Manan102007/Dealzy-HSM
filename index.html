<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEALZY | Discover Local. Shop Smart.</title>
    <meta name="description" content="Dealzy - Discover local stores, deals and products all in one place.">

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #video-loader {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            transition: opacity 0.6s ease;
        }

        #video-loader.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        #intro-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>

    <div id="video-loader">
        <video
            id="intro-video"
            src="assets/videos/gemini_generated_video_70dd35e9.mp4"
            autoplay
            muted
            playsinline
            preload="auto"
        ></video>
    </div>

    <script>
        const video  = document.getElementById('intro-video');
        const loader = document.getElementById('video-loader');
        let redirected = false;

        function goToLogin() {
            if (redirected) return;
            redirected = true;
            loader.classList.add('fade-out');
            setTimeout(() => { window.location.href = 'login.html'; }, 650);
        }

        // Skip the first 1 second from the front
        video.addEventListener('loadedmetadata', () => { video.currentTime = 1; });

        video.addEventListener('ended', goToLogin);

        video.addEventListener('timeupdate', () => {
            if (video.currentTime >= 8) goToLogin(); // 1s offset + 7s playback = cut at 8s
        });

        video.addEventListener('error', () => setTimeout(goToLogin, 4000));

        setTimeout(goToLogin, 9000);
    </script>
</body>
</html>
